<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440"><g font-family="DejaVu Sans"><rect x="0" y="0" width="960" height="440" rx="0" fill="#111c30"/><text x="42" y="58" font-size="38" font-weight="700" fill="#edf5ff" text-anchor="start">Follow the two shaft speeds</text><text x="42" y="98" font-size="24" font-weight="500" fill="#a9c5e5" text-anchor="start">Reference example   |   N = 10:1</text><rect x="42" y="135" width="250" height="136" rx="14" fill="#243753"/><text x="58" y="170" font-size="27" font-weight="700" fill="#edf5ff" text-anchor="start">Motor rotor</text><text x="58" y="208" font-size="23" font-weight="500" fill="#edf5ff" text-anchor="start">J = 0.0002 kg·m²</text><text x="58" y="244" font-size="24" font-weight="500" fill="#84e3d6" text-anchor="start">1200 rpm</text><rect x="355" y="135" width="250" height="136" rx="14" fill="#243753"/><text x="371" y="170" font-size="27" font-weight="700" fill="#edf5ff" text-anchor="start">Gear input</text><text x="371" y="208" font-size="23" font-weight="500" fill="#edf5ff" text-anchor="start">J = 5e-05 kg·m²</text><text x="371" y="244" font-size="24" font-weight="500" fill="#84e3d6" text-anchor="start">1200 rpm</text><rect x="668" y="135" width="250" height="136" rx="14" fill="#243753"/><text x="684" y="170" font-size="27" font-weight="700" fill="#edf5ff" text-anchor="start">Output load</text><text x="684" y="208" font-size="23" font-weight="500" fill="#edf5ff" text-anchor="start">J = 0.04 kg·m²</text><text x="684" y="244" font-size="24" font-weight="500" fill="#84e3d6" text-anchor="start">120 rpm</text><path d="M298 201 L347 201" stroke="#84e3d6" stroke-width="3" /><path d="M347 201l-13 -7v14z" fill="#84e3d6"/><path d="M611 201 L660 201" stroke="#84e3d6" stroke-width="3" /><path d="M660 201l-13 -7v14z" fill="#84e3d6"/><rect x="42" y="297" width="876" height="111" rx="14" fill="#183b46"/><text x="64" y="334" font-size="26" font-weight="700" fill="#edf5ff" text-anchor="start">Move the output inertia to the motor shaft</text><text x="64" y="377" font-size="28" font-weight="500" fill="#edf5ff" text-anchor="start">0.04 ÷ 10² = 0.0004 kg·m²  (output load only)</text></g></svg>
